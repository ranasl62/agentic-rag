# Production-ready Agentic RAG: local-first, Ollama + Qdrant + Postgres + Redis
# Usage: cp .env.example .env && docker compose up -d

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentic_rag}
      POSTGRES_USER: ${POSTGRES_USER:-agentic_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    # Published host port (use 5433 to avoid clash with local Postgres on 5432)
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentic_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.7.4
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    # Qdrant image has no curl/wget; rely on service_started for depends_on

  # Optional: start only if you don't have Ollama on the host — docker compose up -d ollama
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles:
      - with-ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Phase 5: PgBouncer so API/Celery don't exhaust Postgres connections
  pgbouncer:
    image: bitnami/pgbouncer:latest
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-agentic_rag}
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-agentic_rag}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-change_me_secure_password}
      PGBOUNCER_PORT: "6432"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_AUTH_TYPE: md5
    depends_on:
      postgres:
        condition: service_healthy

  # Phase 4: Nginx LB in front of API. Single entry point; scale with: docker compose up -d --scale api-service=2
  nginx:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  api-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: on-failure
    # Port not published: traffic goes through nginx (Phase 4). For direct API access use API_PORT on nginx (default 8080).
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Phase 5: connect via PgBouncer to avoid exhausting Postgres connections with multiple replicas
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 6432
      POSTGRES_DB: ${POSTGRES_DB:-agentic_rag}
      POSTGRES_USER: ${POSTGRES_USER:-agentic_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_secure_password}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      # Use host's Ollama by default; set OLLAMA_HOST=http://ollama if using the with-ollama profile
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal}
      OLLAMA_PORT: ${OLLAMA_PORT:-11434}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      pgbouncer:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000

  # Phase 3: async ingestion (optional; run with docker compose up -d celery-worker)
  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: on-failure
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 6432
      POSTGRES_DB: ${POSTGRES_DB:-agentic_rag}
      POSTGRES_USER: ${POSTGRES_USER:-agentic_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_secure_password}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal}
      OLLAMA_PORT: ${OLLAMA_PORT:-11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      pgbouncer:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    command: celery -A src.worker.celery_app worker -l info

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: on-failure
    environment:
      # So Next server can proxy /api-rag to the API by service name (avoids resolving request host like container id)
      RAG_API_INTERNAL_URL: http://api-service:8000
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      api-service:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  redis_data:

networks:
  default:
    name: agentic_rag_network
