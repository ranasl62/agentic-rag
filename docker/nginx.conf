# Phase 4: Load balancer in front of api-service.
# With --scale api-service=N, Docker DNS round-robins api-service to N replicas.
# Resolver + variable in proxy_pass forces per-request DNS so traffic spreads across replicas.
# Production-ready: larger body limit and timeouts for document uploads; strict default for other routes.
# CORS is handled entirely by FastAPI CORSMiddleware — Nginx only proxies.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Default: allow 1m for normal API (search, query, etc.) to avoid huge JSON bodies
    client_max_body_size 1m;

    # ── Document upload: allow large PDFs/books (100MB) ─────────────────────
    location /upload/ {
        client_max_body_size 100m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        set $backend api-service;
        proxy_pass http://$backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_next_upstream error timeout http_500 http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }

    # ── All other API routes ────────────────────────────────────────────────
    location / {
        set $backend api-service;
        proxy_pass http://$backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_500 http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }
}
